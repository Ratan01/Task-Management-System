server:
  port: 8085

spring:
  application:
    name: notification-service
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  internal:
    token: ${INTERNAL_TOKEN:}
  notifications:
    email:
      enabled: ${NOTIFICATIONS_EMAIL_ENABLED:true}
      from: ${NOTIFICATIONS_EMAIL_FROM:no-reply@taskapp.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info