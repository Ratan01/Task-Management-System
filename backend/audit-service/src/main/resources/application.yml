server:
  port: 8084

spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/auditdb}
    username: ${AUDIT_DB_USER:}
    password: ${AUDIT_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  internal:
    token: ${INTERNAL_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info